name: ROS 2 Workflow

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: "ROS 2 ${{ matrix.distro }}"
    runs-on: ubuntu-latest
    container: ros:${{ matrix.distro }}-ros-base
    strategy:
      fail-fast: false
      matrix:
        distro: [ jazzy, kilted, lyrical ]
    defaults:
      run:
        shell: bash
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4
        with:
          path: src/open_vins
      - name: Install Dependencies
        run: |
          apt-get update
          rosdep update --rosdistro ${{ matrix.distro }}
          rosdep install --from-paths src --ignore-src --rosdistro ${{ matrix.distro }} -y
      - name: Build
        run: |
          source /opt/ros/${{ matrix.distro }}/setup.bash
          MAKEFLAGS=-j2 colcon build --event-handlers console_cohesion+ \
            --cmake-args -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DBUILD_OV_EXAMPLES=ON -DDISABLE_MATPLOTLIB=ON
      - name: Unit Tests
        run: |
          source install/setup.bash
          colcon test --packages-select ov_core ov_init ov_msckf --event-handlers console_cohesion+
          colcon test-result --verbose
      - name: Installed CMake Consumer
        run: |
          source install/setup.bash
          cmake -S src/open_vins/ov_msckf/test/installed_consumer -B installed-consumer -DCMAKE_BUILD_TYPE=Release
          cmake --build installed-consumer --parallel 2
          installed-consumer/open_vins_installed_consumer
      - name: Simulation Accuracy
        run: |
          source install/setup.bash
          python3 src/open_vins/ov_eval/benchmark/benchmark.py run --data . --results sim --only sim_udel_gore --repeat 2
          python3 src/open_vins/ov_eval/benchmark/benchmark.py check --results sim \
            --baseline src/open_vins/ov_eval/benchmark/baselines/reference.json \
            --only sim_udel_gore --ate-tolerance 0.25 --rpe-tolerance 0.3
